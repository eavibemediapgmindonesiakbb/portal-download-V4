<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *{margin:0;box-sizing:border-box;font-family:sans-serif}
    body{background:#059669;min-height:100vh}
 .hidden{display:none!important}
 .box{background:#fff;border-radius:20px;padding:24px;max-width:360px;margin:60px auto}
 .logo{display:block;width:70px;margin:0 auto 15px}
    h1{color:#fff;text-align:center;font-size:20px;margin-bottom:5px}
    h2{color:#059669;text-align:center;font-size:18px;margin-bottom:20px}
    p.sub{color:#fff;text-align:center;font-size:13px;margin-bottom:20px}
    input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
    button{width:100%;background:#059669;color:#fff;border:none;padding:15px;border-radius:10px;font-size:16px;font-weight:bold;margin-top:10px}
    button:disabled{background:#ccc}
 .err{color:red;text-align:center;margin:10px 0;font-size:14px}
 .dash{padding:15px}
 .card{background:#fff;border-radius:15px;padding:15px;margin-bottom:12px}
 .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
 .lunas{background:#d1fae5;color:#065f46;padding:3px 10px;border-radius:10px;font-size:12px}
 .belum{background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:10px;font-size:12px}
  </style>
</head>
<body>
  <div id="login">
    <img src="https://i.ibb.co/7J7FqxQ/logo-pgm.png" class="logo">
    <h1>PGM Indonesia<br>Bandung Barat</h1>
    <p class="sub">Perkumpulan Guru Madrasah (PGM)</p>
    <div class="box">
      <h2>Selamat Datang!</h2>
      <input id="nik" placeholder="NIK" type="number">
      <input id="pw" type="password" placeholder="Password">
      <div id="msg" class="err"></div>
      <button onclick="login()" id="btn">Masuk</button>
    </div>
  </div>

  <div id="dash" class="hidden">
    <h1 style="margin:20px 0">Dashboard Anggota</h1>
    <div class="dash">
      <div class="card">
        <h3 style="color:#059669;margin-bottom:10px">Assalamu'alaikum, <span id="nama"></span></h3>
        <div class="row"><span>NIK</span><b id="dnik"></b></div>
        <div class="row"><span>Status</span><b id="dstatus"></b></div>
        <div class="row"><span>Iuran</span><span id="diuran"></span></div>
      </div>
      <div class="card">
        <button id="btnDown" disabled>Download Sertifikat</button>
        <button onclick="logout()" style="background:#ef4444;margin-top:8px">Logout</button>
      </div>
    </div>
  </div>

<script>
function login(){
  const n=nik.value,p=pw.value;
  msg.innerText='';btn.innerText='Loading...';btn.disabled=true;
  google.script.run.withSuccessHandler(r=>{
    btn.innerText='Masuk';btn.disabled=false;
    if(r.s){
      login.classList.add('hidden');
      dash.classList.remove('hidden');
      nama.innerText=r.n;dnik.innerText=r.nik;dstatus.innerText=r.st;
      if(r.i=='Lunas'){
        diuran.className='lunas';diuran.innerText='Lunas';
        btnDown.disabled=false;btnDown.onclick=()=>window.open(r.l);
      }else{
        diuran.className='belum';diuran.innerText='Belum';
        btnDown.disabled=true;
      }
    }else{msg.innerText=r.p}
  }).cekLogin(n,p);
}
function logout(){
  dash.classList.add('hidden');
  login.classList.remove('hidden');
  nik.value='';pw.value='';
}
</script>
</body>
</html>
