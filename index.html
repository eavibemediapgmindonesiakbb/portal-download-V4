<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0;box-sizing:border-box;font-family:sans-serif}
    body{background:#f0f0f0;padding:20px}
 .card{background:#fff;border-radius:15px;padding:20px;max-width:350px;margin:50px auto;box-shadow:0 2px 10px #0002}
    h2{color:#059669;text-align:center;margin-bottom:20px}
    input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
    button{width:100%;background:#059669;color:#fff;border:none;padding:14px;border-radius:8px;font-size:16px;font-weight:bold;margin-top:10px}
    button:disabled{background:#ccc}
 .err{color:red;text-align:center;margin:10px 0}
 .hidden{display:none}
 .header{background:#059669;color:#fff;padding:15px;text-align:center;border-radius:15px 15px 0 0}
 .isi{padding:15px}
 .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
 .lunas{background:#d1fae5;color:#065f46;padding:3px 10px;border-radius:10px;font-size:12px}
 .belum{background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:10px;font-size:12px}
  </style>
</head>
<body>
  <div id="login" class="card">
    <h2>PGM Indonesia KBB</h2>
    <input id="nik" placeholder="NIK">
    <input id="pw" type="password" placeholder="Password">
    <div id="msg" class="err"></div>
    <button onclick="login()" id="btn">Masuk</button>
  </div>

  <div id="dash" class="card hidden">
    <div class="header">
      <h3>Dashboard Anggota</h3>
      <p id="nama"></p>
    </div>
    <div class="isi">
      <div class="row"><span>NIK</span><b id="dnik"></b></div>
      <div class="row"><span>Status</span><b id="dstatus"></b></div>
      <div class="row"><span>Iuran</span><span id="diuran"></span></div>
      <button id="btnDown" disabled>Download Sertifikat</button>
      <button onclick="logout()" style="background:#ef4444;margin-top:8px">Logout</button>
    </div>
  </div>

<script>
function login(){
  const n=document.getElementById('nik').value;
  const p=document.getElementById('pw').value;
  const b=document.getElementById('btn');
  const m=document.getElementById('msg');
  m.innerText='';b.innerText='Loading...';b.disabled=true;
  
  google.script.run.withSuccessHandler(r=>{
    b.innerText='Masuk';b.disabled=false;
    if(r.s){
      login.classList.add('hidden');
      dash.classList.remove('hidden');
      nama.innerText=r.n;dnik.innerText=r.nik;dstatus.innerText=r.st;
      if(r.i=='Lunas'){
        diuran.className='lunas';diuran.innerText='Lunas';
        btnDown.disabled=false;btnDown.onclick=()=>window.open(r.l);
      }else{
        diuran.className='belum';diuran.innerText='Belum';
        btnDown.disabled=true;
      }
    }else{m.innerText=r.p}
  }).cekLogin(n,p);
}
function logout(){
  dash.classList.add('hidden');
  login.classList.remove('hidden');
  nik.value='';pw.value='';
}
</script>
</body>
</html>
